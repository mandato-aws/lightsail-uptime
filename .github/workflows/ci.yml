name: CI

# Automatic runs are disabled for now: the only active trigger is manual
# dispatch from the Actions tab. To re-enable, uncomment the two blocks below.
#
# They are deliberately not `push: branches: ['**']` — that plus `pull_request`
# built every PR commit twice. Limiting push to the default branch and letting
# pull_request cover everything else gives one run per commit.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

  validate:
    name: Validate SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AWS SAM CLI
        run: pip install --upgrade aws-sam-cli

      - name: sam validate --lint
        run: sam validate --lint --region us-east-1

      - name: sam build
        run: sam build
